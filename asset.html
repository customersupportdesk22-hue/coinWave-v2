
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071a3d">
  <title>Asset Details | CoinWave</title>
  <style>
    :root {
      --navy:#071a3d;
      --navy2:#102b58;
      --blue:#087cf0;
      --blue2:#0066d5;
      --gold:#e8b94f;
      --bg:#f4f7fc;
      --white:#fff;
      --text:#14213d;
      --muted:#71809b;
      --line:#e4eaf3;
      --green:#079b68;
      --red:#df4257;
      --shadow:0 12px 35px rgba(13,35,76,.08);
    }
    * { box-sizing:border-box; }
    body {
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }
    button,a { font:inherit; }
    a { text-decoration:none; }
    .topbar {
      background:var(--navy);
      color:white;
      padding:15px 20px;
    }
    .topbar-inner {
      max-width:1100px;
      margin:auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:15px;
    }
    .brand {
      color:white;
      font-size:21px;
      font-weight:850;
      letter-spacing:-.6px;
    }
    .brand span { color:var(--gold); }
    .top-link {
      color:#dce8ff;
      font-size:13px;
      font-weight:650;
    }
    main {
      max-width:1000px;
      margin:25px auto 60px;
      padding:0 18px;
    }
    .back-row { margin-bottom:20px; }
    .back-btn {
      display:inline-flex;
      align-items:center;
      gap:9px;
      border:1px solid #dce5f2;
      border-radius:12px;
      background:white;
      color:var(--navy);
      padding:10px 15px;
      font-size:14px;
      font-weight:750;
      cursor:pointer;
      box-shadow:0 3px 10px rgba(13,35,76,.04);
      transition:background .18s,border-color .18s,transform .18s;
    }
    .back-btn:hover {
      background:#edf5ff;
      border-color:#b9d6fb;
    }
    .back-btn:active { transform:scale(.97); }
    .back-arrow { font-size:20px; line-height:12px; }
    .heading {
      display:flex;
      align-items:center;
      gap:14px;
      margin-bottom:20px;
    }
    .coin-logo {
      width:55px;
      height:55px;
      border-radius:50%;
      object-fit:contain;
      background:white;
      border:1px solid var(--line);
      padding:7px;
    }
    h1 {
      margin:0;
      color:var(--navy);
      font-size:25px;
      letter-spacing:-.7px;
    }
    .symbol {
      margin-top:4px;
      color:var(--muted);
      font-size:13px;
      font-weight:750;
      text-transform:uppercase;
    }
    .card {
      background:white;
      border:1px solid var(--line);
      border-radius:18px;
      padding:23px;
      box-shadow:var(--shadow);
      margin-bottom:18px;
    }
    .price-label {
      color:var(--muted);
      font-size:13px;
      font-weight:650;
    }
    .price {
      margin:8px 0;
      color:var(--navy);
      font-size:clamp(29px,6vw,42px);
      font-weight:850;
      letter-spacing:-1.2px;
      overflow-wrap:anywhere;
    }
    .change {
      display:inline-flex;
      border-radius:8px;
      padding:6px 10px;
      font-size:13px;
      font-weight:800;
    }
    .positive { color:var(--green); background:#e8f8f1; }
    .negative { color:var(--red); background:#fff0f1; }
    .neutral { color:var(--muted); background:#f0f3f8; }
    .stats {
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:12px;
    }
    .stat {
      background:#f8faff;
      border:1px solid var(--line);
      border-radius:13px;
      padding:16px;
      min-width:0;
    }
    .stat-label {
      color:var(--muted);
      font-size:12px;
      font-weight:650;
      margin-bottom:8px;
    }
    .stat-value {
      color:var(--navy);
      font-size:17px;
      font-weight:800;
      overflow-wrap:anywhere;
    }
    .actions {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
      margin-top:20px;
    }
    .action {
      display:flex;
      align-items:center;
      justify-content:center;
      border-radius:12px;
      padding:14px;
      font-size:15px;
      font-weight:800;
      transition:transform .18s,background .18s;
    }
    .action:active { transform:scale(.98); }
    .buy { background:var(--blue); color:white; }
    .buy:hover { background:var(--blue2); }
    .sell { background:var(--navy); color:white; }
    .sell:hover { background:var(--navy2); }
    .notice {
      color:var(--muted);
      font-size:12px;
      line-height:1.6;
      margin:15px 0 0;
    }
    .status {
      color:var(--muted);
      text-align:center;
      padding:35px 15px;
      font-size:14px;
    }
    .error { color:var(--red); }
    .footer {
      text-align:center;
      color:var(--muted);
      font-size:12px;
      padding:20px 0;
    }
    .footer a { color:var(--blue); margin:0 7px; }
    @media(max-width:650px) {
      main { margin-top:19px; padding:0 13px; }
      .card { padding:18px; }
      .stats { grid-template-columns:1fr 1fr; }
      .stat:last-child { grid-column:1/-1; }
      h1 { font-size:22px; }
    }
    @media(max-width:380px) {
      .stats { grid-template-columns:1fr; }
      .stat:last-child { grid-column:auto; }
      .actions { gap:8px; }
      .action { padding:13px 8px; font-size:14px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/">Coin<span>Wave</span></a>
      <a class="top-link" href="/">Markets</a>
    </div>
  </header>

  <main>
    <div class="back-row">
      <button class="back-btn" id="backButton" type="button">
        <span class="back-arrow" aria-hidden="true">‹</span>
        <span>Back</span>
      </button>
    </div>

    <div id="assetContent">
      <div class="status">Loading asset information...</div>
    </div>

    <footer class="footer">
      <a href="/terms">Terms of Service</a>
      <a href="/privacy">Privacy Policy</a>
      <div style="margin-top:9px">© <span id="year"></span> CoinWave</div>
    </footer>
  </main>

  <script>
    'use strict';

    document.getElementById('year').textContent =
      new Date().getFullYear();

    // Return to the actual previous page, preserving its browser history
    // and scroll position. Only use Home when no previous entry exists.
    document.getElementById('backButton').addEventListener('click', function () {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.assign('/');
      }
    });

    const content = document.getElementById('assetContent');
    const params = new URLSearchParams(window.location.search);
    const requestedSymbol = (params.get('symbol') || '').trim().toUpperCase();

    function escapeHTML(value) {
      return String(value ?? '').replace(/[&<>"']/g, function (char) {
        return ({
          '&':'&amp;',
          '<':'&lt;',
          '>':'&gt;',
          '"':'&quot;',
          "'":'&#39;'
        })[char];
      });
    }

    function money(value) {
      const number = Number(value);
      if (!Number.isFinite(number)) return '—';

      return new Intl.NumberFormat('en-US', {
        style:'currency',
        currency:'USD',
        maximumFractionDigits:number < 1 ? 8 : 2
      }).format(number);
    }

    function compactMoney(value) {
      const number = Number(value);
      if (!Number.isFinite(number)) return '—';

      return new Intl.NumberFormat('en-US', {
        style:'currency',
        currency:'USD',
        notation:'compact',
        maximumFractionDigits:2
      }).format(number);
    }

    function renderAsset(asset) {
      const symbol = String(asset.symbol || '').toUpperCase();
      const name = escapeHTML(asset.name || symbol);
      const safeSymbol = encodeURIComponent(symbol);
      const change = Number(asset.change24h);
      const hasChange = Number.isFinite(change);
      const changeClass = !hasChange
        ? 'neutral'
        : change >= 0 ? 'positive' : 'negative';

      const changeText = hasChange
        ? (change > 0 ? '+' : '') + change.toFixed(2) + '%'
        : 'Unavailable';

      const image = asset.image
        ? `<img class="coin-logo" src="${escapeHTML(asset.image)}"
             alt="${name} logo"
             onerror="this.style.display='none'">`
        : `<div class="coin-logo" aria-hidden="true"
             style="display:grid;place-items:center;font-weight:850;color:#087cf0">
             ${escapeHTML(symbol.slice(0,3))}
           </div>`;

      content.innerHTML = `
        <section class="heading">
          ${image}
          <div>
            <h1>${name}</h1>
            <div class="symbol">${escapeHTML(symbol)} · Digital Asset</div>
          </div>
        </section>

        <section class="card">
          <div class="price-label">Current market price</div>
          <div class="price">${money(asset.price)}</div>
          <span class="change ${changeClass}">${changeText} <span style="margin-left:4px">24h</span></span>

          <div class="stats" style="margin-top:22px">
            <div class="stat">
              <div class="stat-label">Market Capitalization</div>
              <div class="stat-value">${compactMoney(asset.marketCap)}</div>
            </div>
            <div class="stat">
              <div class="stat-label">24h Trading Volume</div>
              <div class="stat-value">${compactMoney(asset.volume24h)}</div>
            </div>
            <div class="stat">
              <div class="stat-label">Market Rank</div>
              <div class="stat-value">${asset.rank ? '#' + escapeHTML(asset.rank) : '—'}</div>
            </div>
          </div>

          <div class="actions">
            <a class="action buy"
               href="/login?asset=${safeSymbol}&side=buy">Buy ${escapeHTML(symbol)}</a>
            <a class="action sell"
               href="/login?asset=${safeSymbol}&side=sell">Sell ${escapeHTML(symbol)}</a>
          </div>

          <p class="notice">
            Market prices and statistics are provided for information and may
            change. Buy and Sell actions require you to sign in. An order is
            not submitted until the platform's order process is completed.
          </p>
        </section>
      `;
    }

    async function loadAsset() {
      if (!/^[A-Z0-9]{1,15}$/.test(requestedSymbol)) {
        content.innerHTML =
          '<div class="status error">A valid asset symbol is required.</div>';
        return;
      }

      try {
        const response = await fetch('/api/markets', {
          headers:{ accept:'application/json' },
          cache:'no-store'
        });

        if (!response.ok) {
          throw new Error('Market data is temporarily unavailable.');
        }

        const result = await response.json();
        const markets = Array.isArray(result)
          ? result
          : Array.isArray(result.markets)
            ? result.markets
            : Array.isArray(result.data)
              ? result.data
              : [];

        const asset = markets.find(function (item) {
          return String(item.symbol || '').toUpperCase() === requestedSymbol;
        });

        if (!asset) {
          content.innerHTML =
            '<div class="status error">Asset not found in the available market data.</div>';
          return;
        }

        renderAsset(asset);
      } catch (error) {
        content.innerHTML = `
          <div class="status error">
            ${escapeHTML(error.message || 'Unable to load asset information.')}
            <div style="margin-top:12px">
              <button class="back-btn" type="button" onclick="location.reload()">
                Try again
              </button>
            </div>
          </div>
        `;
      }
    }

    loadAsset();
  </script>
</body>
</html>
