<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#06133f"><title>CoinWave | Account activity</title><link rel="stylesheet" href="/style.css"><style>
body{background:#f3f6fc;color:#172544;font-family:Arial,sans-serif}.page{width:min(1100px,calc(100% - 28px));margin:34px auto 70px}.top{background:#06133f;color:#fff}.top .wrap{width:min(1100px,calc(100% - 28px));min-height:68px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{color:#fff;text-decoration:none;font-size:23px;font-weight:800}.brand b{color:#12c8f4}.nav{display:flex;gap:15px;flex-wrap:wrap}.nav a{color:#e6efff;text-decoration:none;font-size:13px;font-weight:700}.heading{margin-bottom:20px}.heading h1{margin:0;color:#06133f;font-size:30px}.heading p{color:#71809a;font-size:14px;line-height:1.6}.panel{background:#fff;border:1px solid #e4eaf4;border-radius:16px;padding:20px;margin:16px 0;overflow:auto}.muted{color:#8490a6}.table{width:100%;min-width:600px;border-collapse:collapse}.table th,.table td{text-align:left;padding:13px 12px;border-bottom:1px solid #edf0f6;font-size:13px}.table th{color:#8490a6;background:#f8faff}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.item{padding:14px;background:#f8faff;border-radius:10px}.item small{display:block;color:#8490a6;margin-bottom:6px}.item strong{overflow-wrap:anywhere}.notice{padding:13px;background:#fff8e6;border:1px solid #f2e3b5;border-radius:10px;color:#775d19;font-size:13px;line-height:1.6}.btn{display:inline-flex;padding:11px 16px;border-radius:10px;background:#087cf0;color:#fff;text-decoration:none;border:0;font-weight:700;cursor:pointer}.field{display:grid;gap:7px;margin:13px 0}.field label{font-size:13px;font-weight:700}.field input,.field select{width:100%;padding:12px;border:1px solid #dce4f1;border-radius:10px;font:inherit}.error{color:#bd3447}.success{color:#13845a}@media(max-width:600px){.grid{grid-template-columns:1fr}.top .wrap{padding:12px 0;align-items:flex-start;flex-direction:column}.page{margin-top:24px}}
</style></head><body><header class="top"><div class="wrap"><a class="brand" href="/dashboard">Coin<b>Wave</b></a><nav class="nav"><a href="/dashboard">Dashboard</a><a href="/wallet">Wallet</a><a href="/markets">Markets</a><a href="/activity">Activity</a><a href="/profile">Account</a></nav></div></header><main class="page"><div class="heading"><h1>Account activity</h1><p>Review your latest buy and sell orders and their current processing status.</p></div>
<section class="panel"><div style="overflow:auto"><table class="table"><thead><tr><th>Reference</th><th>Side</th><th>Asset</th><th>Quantity</th><th>Status</th><th>Created</th></tr></thead><tbody id="rows"><tr><td colspan="6">Loading activity…</td></tr></tbody></table></div><p id="message" class="muted">Only orders associated with your signed-in account are shown.</p></section></main><script>(function(){function qty(v){var n=Number(v);return Number.isFinite(n)?n.toLocaleString('en-US',{maximumFractionDigits:8}):'—'}fetch('/api/orders/my?page=1&limit=50',{cache:'no-store',credentials:'same-origin'}).then(function(r){if(!r.ok)throw Error('Activity service returned HTTP '+r.status);return r.json()}).then(function(d){var list=Array.isArray(d.orders)?d.orders:[],body=document.getElementById('rows');body.textContent='';list.forEach(function(o){var tr=document.createElement('tr');[o.reference,o.side,o.asset,qty(o.quantity),String(o.status||'').replace(/_/g,' '),o.createdAt?new Date(o.createdAt).toLocaleString():'—'].forEach(function(v){var td=document.createElement('td');td.textContent=v||'—';tr.appendChild(td)});body.appendChild(tr)});if(!list.length){var tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=6;td.textContent='No orders have been recorded yet.';tr.appendChild(td);body.appendChild(tr)}document.getElementById('message').textContent='Showing '+list.length+' recent order(s).'}).catch(function(e){document.getElementById('message').textContent=e.message;});})();</script></body></html>
