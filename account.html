<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CoinWave | Account</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">

  <style>
    .auth{max-width:480px;margin:32px auto 56px}
    .auth h1{font-size:28px;letter-spacing:-.02em}
    .auth .sub{color:var(--muted);margin:8px 0 24px}
    .field{margin-bottom:16px}
    .field label{display:block;font-size:14px;font-weight:600;margin-bottom:7px}

    .field input,.field select{
      width:100%;
      height:50px;
      padding:0 14px;
      border-radius:10px;
      background:var(--surface);
      border:1px solid var(--line);
      color:var(--text);
      font:16px var(--font);
      box-sizing:border-box;
    }

    .field input:focus,.field select:focus{
      border-color:var(--accent);
      outline:none;
    }

    .pw{position:relative}
    .pw input{padding-right:75px}

    .pw button{
      position:absolute;
      right:6px;
      top:7px;
      height:36px;
      padding:0 12px;
      background:none;
      border:0;
      color:var(--accent);
      font:600 14px var(--font);
      cursor:pointer;
    }

    .rules{
      list-style:none;
      padding:0;
      margin:10px 0 0;
      font-size:13px;
      color:var(--muted);
      display:grid;
      gap:5px;
    }

    .rules li::before{
      content:"•";
      display:inline-block;
      width:18px;
    }

    .rules li.ok{color:var(--up)}
    .rules li.ok::before{content:"✓"}

    .country-trigger{
      width:100%;
      height:52px;
      padding:0 14px;
      display:flex;
      align-items:center;
      gap:12px;
      text-align:left;
      border:1px solid var(--line);
      border-radius:10px;
      background:var(--surface);
      color:var(--text);
      font:16px var(--font);
      cursor:pointer;
    }

    .country-trigger .country-flag{font-size:23px}
    .country-trigger .country-name{flex:1}
    .country-trigger .arrow{color:var(--muted)}

    /* FIXED PHONE NUMBER LAYOUT */
    .phone-row{
      display:grid;
      grid-template-columns:minmax(105px,30%) minmax(0,1fr);
      gap:9px;
      width:100%;
      box-sizing:border-box;
    }

    .phone-row .dial-code{
      display:block;
      width:100%;
      min-width:0;
      height:50px;
      box-sizing:border-box;
      border:1px solid var(--line);
      border-radius:10px;
      background:var(--surface);
      color:var(--text);
      font:15px var(--font);
      padding:0 9px;
    }

    .phone-row input{
      display:block;
      width:100%;
      min-width:0;
      height:50px;
      box-sizing:border-box;
      border:1px solid var(--line);
      border-radius:10px;
      background:var(--surface);
      color:var(--text);
      padding:0 14px;
      font:16px var(--font);
    }

    .currency-info{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:12px 14px;
      border-radius:10px;
      background:rgba(40,120,220,.07);
      border:1px solid var(--line);
      font-size:14px;
    }

    .currency-info strong{color:var(--text)}

    .terms{
      display:flex;
      gap:10px;
      align-items:flex-start;
      font-size:14px;
      color:var(--muted);
      margin:8px 0 17px;
      line-height:1.5;
    }

    .terms input{
      width:20px;
      height:20px;
      margin-top:1px;
      flex:none;
      accent-color:var(--accent);
    }

    .terms a{color:var(--accent)}

    .err{
      color:var(--down);
      font-size:14px;
      min-height:20px;
      margin-bottom:12px;
    }

    .auth .btn{width:100%;height:50px}
    .auth .btn:disabled{opacity:.6;cursor:default}

    .alt{
      margin-top:20px;
      color:var(--muted);
      font-size:15px;
      text-align:center;
    }

    .alt a{color:var(--accent);font-weight:600}

    .detecting{
      font-size:12px;
      color:var(--muted);
      margin-top:6px;
    }

    .country-modal{
      position:fixed;
      inset:0;
      z-index:99999;
      background:#f7f9fc;
      color:#17213a;
      display:none;
      flex-direction:column;
      padding-top:env(safe-area-inset-top);
      padding-bottom:env(safe-area-inset-bottom);
    }

    .country-modal.open{display:flex}

    .country-head{
      display:flex;
      align-items:center;
      gap:14px;
      padding:17px 18px;
      background:#fff;
      border-bottom:1px solid #e3e7ef;
    }

    .country-back{
      border:0;
      background:none;
      font-size:28px;
      color:#17213a;
      cursor:pointer;
      padding:0 5px;
    }

    .country-head h2{
      font-size:19px;
      margin:0;
      flex:1;
    }

    .country-search-wrap{
      padding:13px 16px;
      background:#fff;
    }

    .country-search{
      width:100%;
      height:48px;
      border:1px solid #dce2ec;
      border-radius:11px;
      padding:0 15px;
      font:16px Arial,sans-serif;
      color:#17213a;
      background:#f7f9fc;
      box-sizing:border-box;
    }

    .country-search:focus{outline:2px solid #2878dc}

    .country-hint{
      font-size:12px;
      color:#778197;
      margin:9px 2px 0;
    }

    .country-list{
      flex:1;
      overflow-y:auto;
      overscroll-behavior:contain;
    }

    .country-option{
      width:100%;
      min-height:67px;
      padding:12px 20px;
      display:flex;
      align-items:center;
      gap:15px;
      border:0;
      border-bottom:1px solid #e7eaf0;
      background:#fff;
      text-align:left;
      color:#26334a;
      font:17px Arial,sans-serif;
      cursor:pointer;
    }

    .country-option:active{background:#eaf1ff}
    .country-option .flag{font-size:25px;width:32px}
    .country-option .details{flex:1}
    .country-option .dial{font-size:13px;color:#7b8496}
    .country-option .selected-mark{color:#2878dc;font-size:19px}

    .country-empty{
      padding:35px 20px;
      text-align:center;
      color:#778197;
    }

    @media(max-width:520px){
      .auth{margin:30px auto 45px}
      .country-option{min-height:69px}
    }
  </style>
</head>

<body>
  <header class="header">
    <div class="wrap">
      <a class="logo" href="/">Coin<b>Wave</b></a>
      <nav class="nav">
        <a class="link" href="/#markets">Markets</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <form class="auth" id="form" novalidate>
      <h1 id="title"></h1>
      <p class="sub" id="sub"></p>

      <div class="field signup-only">
        <label for="name">Full name</label>
        <input id="name" autocomplete="name" placeholder="As shown on your ID">
      </div>

      <div class="field">
        <label for="email">Email address</label>
        <input id="email" type="email" autocomplete="email" inputmode="email" placeholder="you@example.com" required>
      </div>

      <div class="field signup-only">
        <label>Country or region</label>
        <button type="button" class="country-trigger" id="countryTrigger">
          <span class="country-flag" id="countryFlag">🌍</span>
          <span class="country-name" id="countryLabel">Select your country</span>
          <span class="arrow">⌄</span>
        </button>
        <div class="detecting" id="detecting">Detecting your country...</div>
        <input type="hidden" id="country" value="">
      </div>

      <div class="field signup-only">
        <label for="phone">Phone number</label>
        <div class="phone-row">
          <select class="dial-code" id="dialCode" aria-label="Country dialing code">
            <option value="">Code</option>
          </select>
          <input id="phone" type="tel" inputmode="tel" autocomplete="tel-national" placeholder="Phone number">
        </div>
      </div>

      <div class="field signup-only">
        <label>Account currency</label>
        <div class="currency-info">
          <span>Detected currency</span>
          <strong id="currencyDisplay">Select a country</strong>
        </div>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="pw">
          <input id="password" type="password">
          <button type="button" class="toggle-password" data-target="password">Show</button>
        </div>

        <ul class="rules signup-only" id="rules">
          <li data-r="len">At least 8 characters</li>
          <li data-r="let">Contains a letter</li>
          <li data-r="num">Contains a number</li>
        </ul>
      </div>

      <div class="field signup-only">
        <label for="confirmPassword">Confirm password</label>
        <div class="pw">
          <input id="confirmPassword" type="password" autocomplete="new-password" placeholder="Enter your password again">
          <button type="button" class="toggle-password" data-target="confirmPassword">Show</button>
        </div>
        <div id="passwordMatch" class="detecting"></div>
      </div>

      <label class="terms signup-only">
        <input type="checkbox" id="terms">
        <span>
          I am 18 or older and agree to the
          <a href="/terms">Terms of Service</a> and
          <a href="/privacy">Privacy Policy</a>.
        </span>
      </label>

      <div class="err" id="err" role="alert"></div>
      <button class="btn btn-primary" id="go" type="submit"></button>
      <p class="alt" id="alt"></p>
    </form>
  </main>

  <div class="country-modal" id="countryModal" aria-hidden="true">
    <div class="country-head">
      <button type="button" class="country-back" id="countryBack" aria-label="Back">‹</button>
      <h2>Select your country</h2>
    </div>

    <div class="country-search-wrap">
      <input class="country-search" id="countrySearch" type="search" placeholder="Search country..." autocomplete="off">
      <p class="country-hint">Choose your country to set your phone code and currency.</p>
    </div>

    <div class="country-list" id="countryList"></div>
  </div>

<script>
(function(){
  'use strict';

  var signup=location.pathname.replace(/\/$/,'')==='/signup';
  var $=function(id){return document.getElementById(id);};

  document.title='CoinWave | '+(signup?'Create account':'Log in');
  $('title').textContent=signup?'Create your account':'Log in';
  $('sub').textContent=signup?'Create your account in just a few steps.':'Welcome back.';
  $('go').textContent=signup?'Create account':'Log in';
  $('password').autocomplete=signup?'new-password':'current-password';

  $('alt').innerHTML=signup
    ?'Already have an account? <a href="/login">Log in</a>'
    :'New to CoinWave? <a href="/signup">Create an account</a>';

  document.querySelectorAll('.signup-only').forEach(function(el){
    if(!signup)el.style.display='none';
  });

  var fallback={
    KE:['Kenya','+254','KES','KSh'],
    US:['United States','+1','USD','$'],
    GB:['United Kingdom','+44','GBP','£'],
    CA:['Canada','+1','CAD','$'],
    AU:['Australia','+61','AUD','$'],
    UG:['Uganda','+256','UGX','USh'],
    TZ:['Tanzania','+255','TZS','TSh'],
    NG:['Nigeria','+234','NGN','₦'],
    ZA:['South Africa','+27','ZAR','R'],
    GH:['Ghana','+233','GHS','GH₵'],
    RW:['Rwanda','+250','RWF','RF'],
    ET:['Ethiopia','+251','ETB','Br'],
    IN:['India','+91','INR','₹'],
    PK:['Pakistan','+92','PKR','₨'],
    AE:['United Arab Emirates','+971','AED','د.إ'],
    SA:['Saudi Arabia','+966','SAR','﷼'],
    DE:['Germany','+49','EUR','€'],
    FR:['France','+33','EUR','€'],
    IT:['Italy','+39','EUR','€'],
    ES:['Spain','+34','EUR','€'],
    NL:['Netherlands','+31','EUR','€'],
    BE:['Belgium','+32','EUR','€'],
    IE:['Ireland','+353','EUR','€'],
    PT:['Portugal','+351','EUR','€'],
    CH:['Switzerland','+41','CHF','CHF'],
    SE:['Sweden','+46','SEK','kr'],
    NO:['Norway','+47','NOK','kr'],
    DK:['Denmark','+45','DKK','kr'],
    PL:['Poland','+48','PLN','zł'],
    TR:['Türkiye','+90','TRY','₺'],
    CN:['China','+86','CNY','¥'],
    JP:['Japan','+81','JPY','¥'],
    KR:['South Korea','+82','KRW','₩'],
    SG:['Singapore','+65','SGD','$'],
    MY:['Malaysia','+60','MYR','RM'],
    ID:['Indonesia','+62','IDR','Rp'],
    PH:['Philippines','+63','PHP','₱'],
    TH:['Thailand','+66','THB','฿'],
    VN:['Vietnam','+84','VND','₫'],
    BR:['Brazil','+55','BRL','R$'],
    MX:['Mexico','+52','MXN','$'],
    AR:['Argentina','+54','ARS','$'],
    NZ:['New Zealand','+64','NZD','$'],
    EG:['Egypt','+20','EGP','£'],
    MA:['Morocco','+212','MAD','د.م.'],
    IL:['Israel','+972','ILS','₪'],
    RU:['Russia','+7','RUB','₽'],
    UA:['Ukraine','+380','UAH','₴'],
    BD:['Bangladesh','+880','BDT','৳'],
    LK:['Sri Lanka','+94','LKR','Rs'],
    NP:['Nepal','+977','NPR','Rs']
  };

  var codes='AF AX AL DZ AS AD AO AI AG AR AM AW AU AT AZ BS BH BD BB BY BE BZ BJ BM BT BO BQ BA BW BR BN BG BF BI CV KH CM CA KY CF TD CL CN CC CO KM CG CD CK CR CI HR CW CY CZ DK DJ DM DO EC EG SV GQ ER EE SZ ET FK FO FJ FI FR GF PF GA GM GE DE GH GI GR GL GD GP GU GT GG GN GW GY HT VA HN HK HU IS IN ID IQ IE IM IL IT JM JP JE JO KZ KE KI KR KW KG LA LV LB LS LR LY LI LT LU MO MG MW MY MV ML MT MH MQ MR MU YT MX FM MD MC MN ME MS MA MZ MM NA NR NP NL NC NZ NI NE NG NU NF MK MP NO OM PK PW PS PA PG PY PE PH PN PL PT PR QA RE RO RW BL SH KN LC MF PM VC WS SM ST SA SN RS SC SL SG SX SK SI SB SO ZA SS ES LK SD SR SJ SE CH TW TJ TZ TH TL TG TK TO TT TN TR TM TC TV UG UA AE GB US UY UZ VU VE VN VG VI WF EH YE ZM ZW'.split(' ');

  var dn;
  try{
    dn=new Intl.DisplayNames(['en'],{type:'region'});
  }catch(e){}

  var countries=codes.map(function(code){
    var f=fallback[code]||[];
    return {
      code:code,
      name:f[0]||(dn&&dn.of(code))||code,
      dial:f[1]||'',
      currency:f[2]||'',
      symbol:f[3]||''
    };
  }).sort(function(a,b){
    return a.name.localeCompare(b.name);
  });

  var selected=null;

  function flag(code){
    return /^[A-Z]{2}$/.test(code)
      ?String.fromCodePoint(
        code.charCodeAt(0)+127397,
        code.charCodeAt(1)+127397
      )
      :'🌍';
  }

  function setCountry(code){
    var c=countries.find(function(x){
      return x.code===code;
    });

    if(!c)return;

    selected=c;
    $('country').value=c.code;
    $('countryFlag').textContent=flag(c.code);
    $('countryLabel').textContent=c.name;

    $('currencyDisplay').textContent=c.currency
      ?c.currency+(c.symbol?' ('+c.symbol+')':'')
      :'Currency unavailable';

    var option=Array.from($('dialCode').options).find(function(o){
      return o.value===c.dial;
    });

    if(c.dial&&!option){
      option=document.createElement('option');
      option.value=c.dial;
      option.textContent=c.dial;
      $('dialCode').appendChild(option);
    }

    $('dialCode').value=c.dial||'';
    $('detecting').textContent='Country selected: '+c.name;
  }

  function renderCountries(query){
    var list=$('countryList');
    list.innerHTML='';
    query=(query||'').trim().toLowerCase();

    var found=countries.filter(function(c){
      return c.name.toLowerCase().includes(query)||
        c.code.toLowerCase()===query||
        (c.dial&&c.dial.includes(query));
    });

    if(!found.length){
      list.innerHTML='<div class="country-empty">No countries found.</div>';
      return;
    }

    found.forEach(function(c){
      var btn=document.createElement('button');
      btn.type='button';
      btn.className='country-option';

      var f=document.createElement('span');
      f.className='flag';
      f.textContent=flag(c.code);

      var name=document.createElement('span');
      name.className='details';
      name.textContent=c.name;

      var dial=document.createElement('span');
      dial.className='dial';
      dial.textContent=c.dial;

      var mark=document.createElement('span');
      mark.className='selected-mark';
      mark.textContent=selected&&selected.code===c.code?'✓':'';

      btn.append(f,name,dial,mark);

      btn.addEventListener('click',function(){
        setCountry(c.code);
        closePicker();
      });

      list.appendChild(btn);
    });
  }

  function openPicker(){
    $('countryModal').classList.add('open');
    $('countryModal').setAttribute('aria-hidden','false');
    document.body.style.overflow='hidden';
    $('countrySearch').value='';
    renderCountries('');

    setTimeout(function(){
      $('countrySearch').focus();
    },100);
  }

  function closePicker(){
    $('countryModal').classList.remove('open');
    $('countryModal').setAttribute('aria-hidden','true');
    document.body.style.overflow='';
  }

  $('countryTrigger').addEventListener('click',openPicker);
  $('countryBack').addEventListener('click',closePicker);

  $('countrySearch').addEventListener('input',function(){
    renderCountries(this.value);
  });

  function populateDialCodes(){
    var select=$('dialCode');
    var seen={};

    countries.forEach(function(c){
      if(c.dial)seen[c.dial]=true;
    });

    Object.keys(seen).sort().forEach(function(code){
      var existing=Array.from(select.options).some(function(o){
        return o.value===code;
      });

      if(existing)return;

      var o=document.createElement('option');
      o.value=code;
      o.textContent=code;
      select.appendChild(o);
    });
  }

  populateDialCodes();

  if(signup){
    fetch('https://restcountries.com/v3.1/all?fields=cca2,name,idd,currencies')
      .then(function(r){
        if(!r.ok)throw Error();
        return r.json();
      })
      .then(function(data){
        data.forEach(function(item){
          if(!item.cca2)return;

          var dial='';

          if(item.idd&&item.idd.root){
            dial=item.idd.root+
              ((item.idd.suffixes||[]).length===1
                ?item.idd.suffixes[0]
                :'');
          }

          var currency='';
          var symbol='';

          if(item.currencies){
            var k=Object.keys(item.currencies)[0];
            if(k){
              currency=k;
              symbol=item.currencies[k].symbol||'';
            }
          }

          var c=countries.find(function(x){
            return x.code===item.cca2;
          });

          if(c){
            c.name=item.name.common||c.name;
            if(dial)c.dial=dial;
            if(currency)c.currency=currency;
            if(symbol)c.symbol=symbol;
          }else{
            countries.push({
              code:item.cca2,
              name:item.name.common||item.cca2,
              dial:dial,
              currency:currency,
              symbol:symbol
            });
          }
        });

        countries.sort(function(a,b){
          return a.name.localeCompare(b.name);
        });

        populateDialCodes();
        renderCountries('');

        if(selected)setCountry(selected.code);
      })
      .catch(function(){});

    fetch('https://ipapi.co/json/')
      .then(function(r){
        if(!r.ok)throw Error();
        return r.json();
      })
      .then(function(data){
        if(data&&data.country_code&&countries.some(function(c){
          return c.code===data.country_code;
        })){
          setCountry(data.country_code);
        }else{
          $('detecting').textContent='Please select your country.';
        }
      })
      .catch(function(){
        var match=(navigator.language||'').match(/[-_]([A-Z]{2})$/i);
        var code=match?match[1].toUpperCase():'';

        if(code&&countries.some(function(c){
          return c.code===code;
        })){
          setCountry(code);
        }else{
          $('detecting').textContent='Please select your country.';
        }
      });
  }

  document.querySelectorAll('.toggle-password').forEach(function(btn){
    btn.addEventListener('click',function(){
      var input=$(this.getAttribute('data-target'));
      var show=input.type==='password';

      input.type=show?'text':'password';
      this.textContent=show?'Hide':'Show';
    });
  });

  $('password').addEventListener('input',function(){
    var v=this.value;

    var ok={
      len:v.length>=8,
      let:/[A-Za-z]/.test(v),
      num:/\d/.test(v)
    };

    document.querySelectorAll('#rules li').forEach(function(li){
      li.classList.toggle('ok',!!ok[li.getAttribute('data-r')]);
    });

    checkMatch();
  });

  $('confirmPassword').addEventListener('input',checkMatch);

  function checkMatch(){
    if(!signup)return;

    var a=$('password').value;
    var b=$('confirmPassword').value;
    var el=$('passwordMatch');

    if(!b){
      el.textContent='';
      el.style.color='';
    }else if(a===b){
      el.textContent='✓ Passwords match';
      el.style.color='#159b68';
    }else{
      el.textContent='Passwords do not match';
      el.style.color='#d34858';
    }
  }

  $('form').addEventListener('submit',function(e){
    e.preventDefault();

    var err=$('err');
    var btn=$('go');

    err.textContent='';

    var email=$('email').value.trim();
    var password=$('password').value;

    if(!email||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
      err.textContent='Enter a valid email address.';
      return;
    }

    if(signup){
      if(!$('name').value.trim()){
        err.textContent='Enter your full name.';
        return;
      }

      if(!$('country').value||!selected){
        err.textContent='Select your country or region.';
        return;
      }

      if(!$('phone').value.trim()){
        err.textContent='Enter your phone number.';
        return;
      }

      if(!/^[0-9\s().-]{6,20}$/.test($('phone').value.trim())){
        err.textContent='Enter a valid phone number.';
        return;
      }

      if(password.length<8||!/[A-Za-z]/.test(password)||!/\d/.test(password)){
        err.textContent='Your password must have at least 8 characters, a letter and a number.';
        return;
      }

      if(password!==$('confirmPassword').value){
        err.textContent='Your passwords do not match.';
        return;
      }

      if(!$('terms').checked){
        err.textContent='Accept the Terms of Service and Privacy Policy to continue.';
        return;
      }
    }

    btn.disabled=true;
    btn.textContent=signup?'Creating account...':'Logging in...';

    var payload={
      name:$('name').value.trim(),
      email:email,
      country:signup?$('country').value:'',
      phone:signup?$('dialCode').value+$('phone').value.trim():'',
      currency:signup&&selected?selected.currency:'',
      password:password,
      terms:signup?$('terms').checked:false
    };

    fetch('/api/auth/'+(signup?'signup':'login'),{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(payload)
    })
    .then(function(r){
      return r.json().then(function(d){
        return{ok:r.ok,data:d};
      });
    })
    .then(function(result){
      if(result.ok){
        location.href='/dashboard';
      }else{
        err.textContent=result.data.error||'Something went wrong.';
        btn.disabled=false;
        btn.textContent=signup?'Create account':'Log in';
      }
    })
    .catch(function(){
      err.textContent='Network error. Check your connection and try again.';
      btn.disabled=false;
      btn.textContent=signup?'Create account':'Log in';
    });
  });

})();
</script>
</body>
</html>
